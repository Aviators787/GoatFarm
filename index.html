<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoatFarm | Pro Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: #fdfaf1; 
            color: #434a54; 
        }
        .card-warm { background: #ffffff; border: 1px solid #e9e2d0; box-shadow: 0 10px 25px -5px rgba(184, 166, 122, 0.15); }
        .btn-primary { background: #3c8d93; color: white; transition: all 0.2s; }
        .btn-primary:hover { background: #2d6a6f; transform: translateY(-1px); }
        .accent-bar { background: linear-gradient(to right, #d4a373, #faedcd); }
        .input-soft { background: #fcfcf9; border: 1px solid #dcd7c9; border-radius: 12px; }
        .input-soft:focus { border-color: #3c8d93; outline: none; ring: 2px ring-teal-100; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex flex-col items-center">
            <h1 class="text-3xl font-bold text-[#3c8d93] tracking-tight">GoatFarm <span class="text-[#d4a373]">Pro</span></h1>
            <div class="h-1 w-24 accent-bar mt-2 rounded-full"></div>
        </header>

        <div id="assetSummary" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="card-warm p-6 rounded-3xl">
                    <h3 class="text-xs font-bold text-[#d4a373] uppercase mb-4 tracking-widest">Register Owner</h3>
                    <div class="space-y-3">
                        <input id="newOwnerName" type="text" placeholder="Partner Name" class="w-full p-3 input-soft text-sm">
                        <button onclick="addOwner()" class="w-full btn-primary p-3 rounded-xl font-bold">Add Owner</button>
                    </div>
                    <div id="ownerList" class="mt-6 space-y-2"></div>
                </div>

                <div class="card-warm p-6 rounded-3xl">
                    <h3 class="text-xs font-bold text-[#d4a373] uppercase mb-4 tracking-widest">Register Goat</h3>
                    <div class="space-y-3">
                        <input id="gName" type="text" placeholder="Goat Tag/ID" class="w-full p-3 input-soft text-sm">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="gOwnerSelect" class="p-3 input-soft text-sm col-span-2"></select>
                            <select id="gGender" class="p-3 input-soft text-sm">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <input id="gPrice" type="number" placeholder="Cost" class="p-3 input-soft text-sm font-mono">
                        </div>
                        <input id="gDate" type="date" class="w-full p-3 input-soft text-sm">
                        <label class="flex items-center gap-2 p-2 bg-[#fdfaf1] rounded-xl cursor-pointer border border-[#ede9dd]">
                            <input type="checkbox" id="gByBirth" class="w-4 h-4 text-[#3c8d93]">
                            <span class="text-xs font-bold text-slate-500">Is this By Birth?</span>
                        </label>
                        <button onclick="addGoat()" class="w-full bg-[#434a54] text-white p-3 rounded-xl font-bold">Add Goat</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="card-warm p-6 rounded-3xl border-t-8 border-[#3c8d93]">
                    <h3 class="text-xs font-bold text-[#3c8d93] uppercase mb-4 tracking-widest">Record Expense</h3>
                    <div class="space-y-4">
                        <input id="eDesc" type="text" placeholder="Purpose" class="w-full p-3 input-soft text-sm">
                        <input id="eAmount" type="number" placeholder="0.00" class="w-full p-4 input-soft text-3xl font-bold text-center text-[#3c8d93]">
                        <select id="ePayerSelect" class="w-full p-3 input-soft text-sm"></select>
                        <div class="p-4 bg-[#f9f7f0] rounded-2xl border border-[#ede9dd]">
                            <div class="flex justify-between items-center mb-3">
                                <p class="text-[10px] font-bold text-[#a69f88] uppercase">Select Goats</p>
                                <button onclick="toggleSelectAll()" id="selectAllBtn" class="text-[10px] font-bold text-[#3c8d93] hover:underline">Select All</button>
                            </div>
                            <div id="goatCheckboxes" class="space-y-2 max-h-40 overflow-y-auto"></div>
                        </div>
                        <button onclick="addExpense()" class="w-full btn-primary p-4 rounded-2xl font-bold shadow-lg">Submit</button>
                    </div>
                </div>

                <div class="card-warm p-6 rounded-3xl bg-[#d4a373] border-none text-white shadow-xl">
                    <h3 class="text-xs font-bold text-white/70 uppercase mb-4 tracking-widest">Settlement</h3>
                    <div class="space-y-3">
                        <select id="sFrom" onchange="syncReceiverList()" class="w-full p-3 rounded-xl bg-white/20 border-none text-sm text-white font-bold outline-none"></select>
                        <div class="flex justify-center -my-4 relative z-10">
                            <button onclick="swapPartners()" class="bg-white text-[#d4a373] p-2 rounded-full shadow-md">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" /></svg>
                            </button>
                        </div>
                        <select id="sTo" class="w-full p-3 rounded-xl bg-white/20 border-none text-sm text-white font-bold outline-none"></select>
                        <input id="sAmount" type="number" placeholder="Amount" class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-center font-bold text-white placeholder:text-white/50 outline-none">
                        <button onclick="settleDues()" class="w-full bg-white text-[#d4a373] p-3 rounded-xl font-bold">Transfer</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="card-warm p-6 rounded-3xl h-full">
                    <h3 class="text-xs font-bold text-[#d4a373] uppercase mb-4 tracking-widest">Active Herd</h3>
                    <div id="herdList" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <div class="mt-12 card-warm p-8 rounded-[40px] overflow-hidden mb-12">
            <h3 class="text-xs font-bold text-[#a69f88] uppercase mb-6 tracking-widest text-center">Master Ledger Log</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-separate border-spacing-y-2">
                    <thead>
                        <tr class="text-[#a69f88] font-bold uppercase text-[10px]">
                            <th class="px-4 pb-2">Date & Time</th><th class="px-4 pb-2">Details</th><th class="px-4 pb-2">Payer</th><th class="px-4 pb-2 text-center">Amount</th><th class="px-4 pb-2 text-right">Type</th>
                        </tr>
                    </thead>
                    <tbody id="historyLog"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fdhpethjmttptamkcjct.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkaHBldGhqbXR0cHRhbWtjamN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNzI0MjMsImV4cCI6MjA5Mjk0ODQyM30._snYjipWXynbhcKmxq8dujgOFSwl-t_xw16qfQkkXuc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let owners = [], goats = [], transactions = [], settlements = [];

        async function init() {
            document.getElementById('gDate').value = new Date().toISOString().split('T')[0];
            await fetchData();
            _supabase.channel('sync').on('postgres_changes', { event: '*', schema: 'public' }, fetchData).subscribe();
        }

        async function fetchData() {
            const { data: o } = await _supabase.from('owners').select('*').order('name');
            const { data: g } = await _supabase.from('goats').select('*').order('created_at', { ascending: false });
            const { data: t } = await _supabase.from('transactions').select('*').order('created_at', { ascending: false });
            const { data: s } = await _supabase.from('settlements').select('*').order('created_at', { ascending: false });
            owners = o || []; goats = g || []; transactions = t || []; settlements = s || [];
            renderUI();
        }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.goat-cb');
            const btn = document.getElementById('selectAllBtn');
            const allChecked = Array.from(checkboxes).every(c => c.checked);
            checkboxes.forEach(c => c.checked = !allChecked);
            btn.innerText = allChecked ? "Select All" : "Deselect All";
        }

        function renderUI() {
            const names = owners.map(o => o.name);
            document.getElementById('gOwnerSelect').innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
            document.getElementById('ePayerSelect').innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
            document.getElementById('sFrom').innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
            syncReceiverList();

            document.getElementById('goatCheckboxes').innerHTML = goats.map(g => `
                <label class="flex items-center gap-3 p-2 hover:bg-white rounded-lg transition cursor-pointer">
                    <input type="checkbox" value="${g.id}" class="goat-cb w-4 h-4 rounded border-[#dcd7c9] text-[#3c8d93]">
                    <span class="text-xs font-semibold text-[#434a54]">${g.name} <span class="text-[#a69f88] font-normal ml-1">(${g.owner})</span></span>
                </label>`).join('');

            document.getElementById('ownerList').innerHTML = owners.map(o => `
                <div class="flex justify-between items-center p-3 bg-[#fdfaf1] rounded-xl border border-[#ede9dd]">
                    <div class="text-[10px]"><b>${o.name}</b><br><span class="opacity-50">Since ${new Date(o.created_at).toLocaleDateString()}</span></div>
                    <button onclick="removeOwner(${o.id})" class="text-[#a69f88] hover:text-red-400 font-bold">×</button>
                </div>`).join('');

            // UPDATED: Active Herd Display includes Gender and By Birth Status
            document.getElementById('herdList').innerHTML = goats.map(g => `
                <div class="p-4 bg-[#fdfaf1] border border-[#ede9dd] rounded-2xl flex justify-between items-start transition hover:border-[#3c8d93]">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <p class="text-xs font-bold text-[#3c8d93] uppercase">${g.name}</p>
                            <span class="text-[9px] font-black px-1.5 py-0.5 rounded ${g.gender === 'Male' ? 'bg-blue-100 text-blue-600' : g.gender === 'Female' ? 'bg-pink-100 text-pink-600' : 'bg-slate-100 text-slate-600'}">${g.gender || 'N/A'}</span>
                            ${g.is_by_birth ? '<span class="text-[8px] bg-amber-100 text-amber-700 px-1 rounded font-bold">BORN ON FARM</span>' : ''}
                        </div>
                        <p class="text-[10px] text-[#a69f88] font-semibold">${g.owner} | ${parseFloat(g.purchase_price).toFixed(0)}</p>
                        <p class="text-[9px] text-slate-400 mt-1 uppercase tracking-tighter">Reg: ${new Date(g.created_at).toLocaleDateString()}</p>
                    </div>
                    <button onclick="removeGoat(${g.id})" class="text-slate-300 hover:text-red-400 p-1">×</button>
                </div>`).join('');

            let summary = {};
            owners.forEach(o => {
                summary[o.name] = { spent: 0, assets: 0, wallet: 0, joinTime: new Date(o.created_at).getTime() };
            });

            goats.forEach(g => { if(summary[g.owner]) summary[g.owner].assets += parseFloat(g.purchase_price); });

            transactions.forEach(t => {
                const txTime = new Date(t.created_at).getTime();
                if(summary[t.payer] && txTime >= summary[t.payer].joinTime) summary[t.payer].wallet += parseFloat(t.amount);
                Object.keys(t.owner_shares || {}).forEach(name => {
                    if(summary[name] && txTime >= summary[name].joinTime) {
                        summary[name].spent += t.owner_shares[name];
                        summary[name].wallet -= t.owner_shares[name];
                    }
                });
            });

            settlements.forEach(s => {
                const sTime = new Date(s.created_at).getTime();
                if(summary[s.from_partner] && summary[s.to_partner] && sTime >= summary[s.from_partner].joinTime && sTime >= summary[s.to_partner].joinTime) {
                    summary[s.from_partner].wallet -= parseFloat(s.amount);
                    summary[s.to_partner].wallet += parseFloat(s.amount);
                }
            });

            const palette = ['bg-[#3c8d93]', 'bg-[#d4a373]', 'bg-[#434a54]'];
            document.getElementById('assetSummary').innerHTML = names.map((n, i) => `
                <div class="${palette[i%3]} p-6 rounded-[2rem] text-white shadow-lg relative">
                    <div class="flex justify-between items-start mb-6">
                        <h2 class="text-xl font-bold uppercase tracking-tighter">${n}</h2>
                        <button onclick="quickSettle('${n}')" class="text-[9px] font-bold bg-white/20 px-2 py-1 rounded">SETTLE</button>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-white/10 p-4 rounded-2xl">
                            <p class="text-[9px] font-bold uppercase opacity-60 mb-1">Spent</p>
                            <p class="text-2xl font-bold">${summary[n].spent.toFixed(0)}</p>
                        </div>
                        <div class="flex justify-between border-t border-white/10 pt-3 text-[10px]">
                            <div><p class="opacity-60 uppercase font-bold text-[8px]">Assets</p><p class="font-bold">${summary[n].assets.toFixed(0)}</p></div>
                            <div class="text-right"><p class="opacity-60 uppercase font-bold text-[8px]">Wallet</p><p class="font-bold ${summary[n].wallet < 0 ? 'text-red-200' : 'text-emerald-200'}">${summary[n].wallet.toFixed(0)}</p></div>
                        </div>
                    </div>
                </div>`).join('');

            const log = [
                ...transactions.map(t => ({...t, type: 'Expense'})),
                ...settlements.map(s => ({...s, type: 'Settlement', payer: s.from_partner, description: `Transfer to ${s.to_partner}`}))
            ].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

            document.getElementById('historyLog').innerHTML = log.map(l => `
                <tr class="bg-white shadow-sm border-b border-[#f3f0e7]">
                    <td class="px-4 py-4 text-[#a69f88] font-mono text-[10px]">${new Date(l.created_at).toLocaleString()}</td>
                    <td class="px-4 py-4 font-bold text-[#434a54]">${l.description}</td>
                    <td class="px-4 py-4 font-black text-[#3c8d93] uppercase italic">${l.payer}</td>
                    <td class="px-4 py-4 font-mono font-bold text-center text-[#d4a373]">${parseFloat(l.amount).toFixed(0)}</td>
                    <td class="px-4 py-4 text-right"><span class="px-2 py-1 rounded text-[9px] font-black ${l.type==='Expense'?'bg-teal-50 text-teal-600':'bg-orange-50 text-orange-600'}">${l.type}</span></td>
                </tr>`).join('');
        }

        async function addOwner() {
            const n = document.getElementById('newOwnerName').value;
            if(!n) return;
            await _supabase.from('owners').insert([{ name: n, created_at: new Date().toISOString() }]);
            document.getElementById('newOwnerName').value = ''; fetchData();
        }

        // UPDATED: addGoat now captures Gender and By Birth checkbox
        async function addGoat() {
            const n = document.getElementById('gName').value, 
                  o = document.getElementById('gOwnerSelect').value, 
                  p = document.getElementById('gPrice').value, 
                  d = document.getElementById('gDate').value,
                  gender = document.getElementById('gGender').value,
                  isBirth = document.getElementById('gByBirth').checked;

            if(!n || !p) return;
            const combinedTime = d + "T" + new Date().toLocaleTimeString('en-GB') + "Z";
            await _supabase.from('goats').insert([{ 
                name: n, 
                owner: o, 
                purchase_price: parseFloat(p), 
                created_at: combinedTime,
                gender: gender,
                is_by_birth: isBirth
            }]);
            document.getElementById('gName').value = ''; 
            document.getElementById('gByBirth').checked = false;
            fetchData();
        }

        async function addExpense() {
            const amt = parseFloat(document.getElementById('eAmount').value), p = document.getElementById('ePayerSelect').value, d = document.getElementById('eDesc').value || "Farm Expense";
            const gIds = Array.from(document.querySelectorAll('.goat-cb:checked')).map(cb => parseInt(cb.value));
            if(!amt || !gIds.length) return alert("Select goats.");
            let shares = {};
            const cost = amt / gIds.length;
            gIds.forEach(id => { const g = goats.find(x => x.id === id); if(g) shares[g.owner] = (shares[g.owner] || 0) + cost; });
            await _supabase.from('transactions').insert([{ amount: amt, payer: p, description: d, owner_shares: shares, created_at: new Date().toISOString() }]);
            document.getElementById('eAmount').value = ''; fetchData();
        }

        async function settleDues() {
            const f = document.getElementById('sFrom').value, t = document.getElementById('sTo').value, a = parseFloat(document.getElementById('sAmount').value);
            if(!a || f === t) return;
            await _supabase.from('settlements').insert([{ from_partner: f, to_partner: t, amount: a, created_at: new Date().toISOString() }]);
            document.getElementById('sAmount').value = ''; fetchData();
        }

        function swapPartners() {
            const f = document.getElementById('sFrom'), t = document.getElementById('sTo'), fv = f.value, tv = t.value;
            f.value = tv; syncReceiverList(); t.value = fv;
        }

        function syncReceiverList() {
            const f = document.getElementById('sFrom').value, t = document.getElementById('sTo'), o = owners.filter(x => x.name !== f);
            t.innerHTML = o.map(x => `<option value="${x.name}">${x.name}</option>`).join('');
        }

        function quickSettle(n) { document.getElementById('sFrom').value = n; syncReceiverList(); document.getElementById('sAmount').focus(); }
        async function removeOwner(id) { if(confirm("Remove?")) { await _supabase.from('owners').delete().eq('id', id); fetchData(); } }
        async function removeGoat(id) { if(confirm("Remove?")) { await _supabase.from('goats').delete().eq('id', id); fetchData(); } }

        init();
    </script>
</body>
</html>
